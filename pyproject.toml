[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnn-ukf-localization"
version = "0.1.0"
description = "Interpretable liquid neural network plus unscented Kalman filter for 2-D AUV localization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "torch>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
